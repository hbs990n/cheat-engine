name: Build CE 64-bit (forced)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: build-64bit
  cancel-in-progress: true

jobs:
  build-win64:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Lazarus (64-bit)
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "2.2.6"
          with-cache: true

      - name: Show toolchain versions
        shell: pwsh
        run: |
          lazbuild --version
          fpc -iV
          fpc -iTO

      - name: Clean previous build outputs (force a full rebuild)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "Cheat Engine\lib" -ErrorAction SilentlyContinue
          Remove-Item -Path "Cheat Engine\bin\cheatengine-x86_64.exe","Cheat Engine\bin\cheatengine-x86_64.exe.dbg" -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter "*.compiled" "Cheat Engine\lib" -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Build Cheat Engine (Release 64-Bit)
        shell: pwsh
        run: |
          lazbuild -B --bm="Release 64-Bit" "Cheat Engine\cheatengine.lpi"

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "Cheat Engine\bin" -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Smoke test (start the exe, make sure it stays alive)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "Cheat Engine\bin\cheatengine-x86_64.exe"
          if (-not (Test-Path $exe)) { throw "built exe not found: $exe" }

          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList "NOAUTORUN" -PassThru
          Start-Sleep -Seconds 15

          if ($p.HasExited) {
            throw "Cheat Engine exited during startup with code $($p.ExitCode) -- not runnable"
          }

          Write-Host "Cheat Engine started successfully (PID $($p.Id))"
          Get-Process -Id $p.Id | Select-Object Id, ProcessName, Responding

          # close it (also try to kill the process tree so the job can finish)
          $null = $p.CloseMainWindow()
          Start-Sleep -Seconds 2
          if (-not $p.HasExited) { $p.Kill($true) }

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifact\cheatengine" | Out-Null
          Get-ChildItem "Cheat Engine\bin" | Copy-Item -Destination "artifact\cheatengine" -Recurse -Force

      - name: Upload portable x64 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cheatengine-bin-win64
          path: artifact\cheatengine\
          if-no-files-found: error